name: iOS → TestFlight

# Roda manualmente: aba Actions → "iOS → TestFlight" → Run workflow.
# Precisa destes "secrets" no repositório (Settings → Secrets and variables → Actions),
# cadastrados por você mesmo:
#   APPLE_TEAM_ID   – Team ID da conta de desenvolvedor (10 letras/números)
#   ASC_KEY_ID      – Key ID da chave de API do App Store Connect
#   ASC_ISSUER_ID   – Issuer ID (aparece no topo da página de chaves)
#   ASC_KEY_P8      – conteúdo inteiro do arquivo AuthKey_XXXX.p8
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar o projeto do iPhone
        working-directory: app
        run: |
          npm install
          mkdir -p www
          cp ../index.html www/index.html
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Ícone e configurações do app
        working-directory: app/ios/App/App
        run: |
          ICON=Assets.xcassets/AppIcon.appiconset
          rm -rf "$ICON" && mkdir -p "$ICON"
          cp ../../../icon-1024.png "$ICON/AppIcon-1024.png"
          cat > "$ICON/Contents.json" <<'JSON'
          {"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Heartville" Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Heartville" Info.plist

      - name: Chave da API da Apple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Compilar (archive)
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KID}.p8 -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Enviar para o TestFlight
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KID}.p8 -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"

      - name: Apagar a chave
        if: always()
        run: rm -rf ~/private_keys
