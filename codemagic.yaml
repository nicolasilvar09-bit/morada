# Heartville — build do app iOS (Capacitor) e envio para o TestFlight
# Igual ao do Paintball: usa a mesma integração "Codemagic" com o App Store Connect.
workflows:
  ios-appstore:
    name: Heartville iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nicolas.heartville
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar arquivos do jogo
        script: |
          set -e
          mkdir -p www assets
          cp index.html www/index.html
          grep -c "APPV=" www/index.html
          cp icon-1024.png assets/icon-only.png
          cp splash.png assets/splash.png
          cp splash.png assets/splash-dark.png
      - name: Instalar dependências
        script: npm install --no-audit --no-fund
      - name: Criar projeto iOS
        script: |
          set -e
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#fbeef2' --iconBackgroundColorDark '#fbeef2' --splashBackgroundColor '#fbeef2' --splashBackgroundColorDark '#fbeef2'
          npx cap sync ios
      - name: Ajustes do app (nome, versão)
        script: |
          set -e
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Heartville" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Heartville" "$PL"
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('ios/App/App.xcodeproj'); p.targets.each{|t| t.build_configurations.each{|c| c.build_settings['CURRENT_PROJECT_VERSION']=ENV['PROJECT_BUILD_NUMBER']||'1'; c.build_settings['MARKETING_VERSION']='1.0'; c.build_settings['TARGETED_DEVICE_FAMILY']='1,2'}}; p.save"
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Gerar o app (IPA)
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers
